# OpenJarvis server deployment.
# Deploy this service as Docker. Do not use Python/FastAPI auto-detection:
# OpenJarvis exposes its FastAPI application through the jarvis serve CLI.
services:
  - type: web
    name: openjarvis-server
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./deploy/docker/Dockerfile
    dockerContext: .
    # Dockerfile ENTRYPOINT is ["jarvis"], so Render runs jarvis serve.
    # This bypasses FastAPI module/variable discovery completely.
    dockerCommand: serve --host 0.0.0.0 --port 10000 --engine cloud --model gpt-4o-mini
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: "10000"
      - key: OPENJARVIS_API_KEY
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENJARVIS_HOME
        value: /home/openjarvis/.openjarvis
